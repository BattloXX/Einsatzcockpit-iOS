<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keine Verbindung · Einsatzcockpit</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 28px; background: #1e293b;
      border: 1px solid #334155; border-radius: 14px; }
    h1 { font-size: 1.5rem; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.5; }
    a, button { display: block; width: 100%; margin-top: 12px; padding: 14px;
      border: 1px solid #475569; border-radius: 10px; background: transparent;
      color: #f1f5f9; text-align: center; text-decoration: none; font: inherit; cursor: pointer; }
    button { background: #2563eb; border-color: #2563eb; }
    a:focus-visible, button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Keine Verbindung</h1>
    <p>Diese Seite ist offline nicht verfügbar. Auf dem iPhone/iPad können nur bereits vom Web-Cache gespeicherte Seiten verfügbar sein. Bitte stelle eine Internetverbindung her.</p>
    <a href="https://einsatzcockpit.com/">Zur Startseite</a>
    <button id="retry" type="button">Erneut versuchen</button>
  </main>
<script>
    const retry = new URLSearchParams(location.hash.slice(1)).get('retry');
    function erlaubteUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' &&
          ['https://einsatzcockpit.com', 'https://www.einsatzcockpit.com'].includes(url.origin) &&
          !url.username && !url.password;
      } catch (_) { return false; }
    }
    document.getElementById('retry').addEventListener('click', function () {
      location.replace(erlaubteUrl(retry) ? retry : 'https://einsatzcockpit.com/');
    });
  </script>
</body>
</html>
